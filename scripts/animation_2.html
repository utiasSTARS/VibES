<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Camera Pyramid + Opaque Plane (Three.js)</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        canvas {
            display: block;
        }

        #info, #legend {
            position: absolute;
            left: 10px;
            font-family: system-ui, sans-serif;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
        }

        #info {
            top: 10px;
        }

        #legend {
            top: 50px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>

    <!-- ES Module import map -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
<div id="info">drag = orbit • wheel = zoom • right-drag = pan</div>

<div id="legend">
    <div class="legend-item">
        <div class="legend-color" style="background:#00ff88;"></div>
        <span>Point A (-10)</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background:#ffaa00;"></div>
        <span>Point B (-2)</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background:#3894ff;"></div>
        <span>Moving Camera</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background:#ff5555;"></div>
        <span>Static Camera</span>
    </div>
</div>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========== Setup Renderer, Scene, Camera ==========
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1014);

    const viewCam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    viewCam.position.set(5, 3, 6);

    const controls = new OrbitControls(viewCam, renderer.domElement);
    controls.target.set(0, 0.75, -2);
    controls.update();

    // ========== Parameters ==========
    const planeDist = 1.0;
    const A_x = 0.2, A_y = 0.1;
    const omega = 5.0, phi = Math.PI / 2;
    const segments = 360;

    // ========== Pyramid Camera Helper ==========
    function createPyramidCamera(color) {
        const fov = 45, aspect = 16 / 9;
        const h = 2 * planeDist * Math.tan(THREE.MathUtils.degToRad(fov) / 2);
        const w = h * aspect;
        const apex = new THREE.Vector3(0, 0, 0);
        const z = -planeDist;
        const halfW = w / 2, halfH = h / 2;

        const corners = [
            new THREE.Vector3(-halfW, halfH, z),
            new THREE.Vector3(halfW, halfH, z),
            new THREE.Vector3(halfW, -halfH, z),
            new THREE.Vector3(-halfW, -halfH, z)
        ];

        // Plane
        const planeMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
        );
        planeMesh.position.set(0, 0, z);
        planeMesh.lookAt(apex.clone().add(new THREE.Vector3(0, 0, 1)));

        // Outline
        const lines = [];
        lines.push(corners[0], corners[1], corners[1], corners[2], corners[2], corners[3], corners[3], corners[0]);
        corners.forEach(c => lines.push(apex, c));
        const pyramidLines = new THREE.LineSegments(
            new THREE.BufferGeometry().setFromPoints(lines),
            new THREE.LineBasicMaterial({ color: 0xffffff })
        );

        // Apex marker
        const apexMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.04, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffcc00 })
        );

        const group = new THREE.Group();
        group.add(planeMesh, pyramidLines, apexMesh);
        return group;
    }

    // ========== Projected Point System ==========
    function createProjectedPoint(zPos, color, movingCam, staticCamApex) {
        const pointPos = new THREE.Vector3(0, 0, zPos);

        // Point Mesh
        const pointMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 16, 16),
            new THREE.MeshBasicMaterial({ color })
        );
        pointMesh.position.copy(pointPos);
        scene.add(pointMesh);

        // Ray to static camera
        const staticRay = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([pointPos, staticCamApex]),
            new THREE.LineBasicMaterial({ color })
        );
        scene.add(staticRay);

        // Circle Trace
        const circlePoints = [];
        const x = (-zPos - planeDist) * A_x / zPos;
        const y = (-zPos - planeDist) * A_y / zPos;

        for (let i = 0; i <= segments; i++) {
            const theta = (i / segments) * Math.PI * 2;
            circlePoints.push(new THREE.Vector3(
                x * Math.sin(theta),
                y * Math.sin(theta + phi),
                -planeDist
            ));
        }

        const circle = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(circlePoints),
            new THREE.LineDashedMaterial({ color, dashSize: 0.05, gapSize: 0.05 })
        );
        circle.computeLineDistances();
        scene.add(circle);

        // Ray to moving camera (updated each frame)
        const movingRayGeo = new THREE.BufferGeometry().setFromPoints([pointPos, movingCam.position.clone()]);
        const movingRay = new THREE.Line(movingRayGeo, new THREE.LineBasicMaterial({ color }));
        scene.add(movingRay);

        return { pointPos, movingRayGeo };
    }

    // ========== Create Cameras ==========
    const movingCam = createPyramidCamera(0x3894ff);
    scene.add(movingCam);

    const centerCam = createPyramidCamera(0xff5555);
    scene.add(centerCam);

    const staticCamApex = new THREE.Vector3(0, 0, 0);

    // ========== Points ==========
    const point1 = createProjectedPoint(-10, 0x00ff88, movingCam, staticCamApex);
    const point2 = createProjectedPoint(-2, 0xffaa00, movingCam, staticCamApex);

    // ========== Animation ==========
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Move blue camera
        movingCam.position.set(
            A_x * Math.sin(omega * t),
            A_y * Math.sin(omega * t + phi),
            0.01
        );

        // Update rays
        point1.movingRayGeo.setFromPoints([point1.pointPos, movingCam.position.clone()]);
        point2.movingRayGeo.setFromPoints([point2.pointPos, movingCam.position.clone()]);

        renderer.render(scene, viewCam);
    }
    animate();
</script>


</body>
</html>
