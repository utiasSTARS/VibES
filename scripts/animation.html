<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>VibES</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        canvas {
            display: block;
        }

        #info, #legend {
            position: absolute;
            left: 10px;
            font-family: system-ui, sans-serif;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
        }

        #info {
            top: 10px;
        }

        #legend {
            top: 50px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>

    <!-- ES Module import map -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
<div id="info">drag = orbit • wheel = zoom • right-drag = pan</div>

<div id="legend">
    <div class="legend-item">
        <div class="legend-color" style="background:#00ff88;"></div>
        <span>Point A</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background:#ffaa00;"></div>
        <span>Point B</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background:#3894ff;"></div>
        <span>Moving Camera</span>
    </div>
    <div class="legend-item">
        <div class="legend-color" style="background:#ff5555;"></div>
        <span>Static Camera</span>
    </div>
</div>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const furthestPoint = new THREE.Vector3(0, 0, -7);
    const movingCenter  = new THREE.Vector3(0, 0, 0);
    const lookTarget    = furthestPoint.clone().lerp(movingCenter, 0.5); // mid point between them

    // Camera positions
    const camStart = new THREE.Vector3(0, 0, -12);   // behind both, aligned with Z
    const camMid   = new THREE.Vector3(5, 3, -7);   // pulled up and sideways
    const camEnd   = new THREE.Vector3(7, 3, 1);     // final oblique side view
    let camProgress = 0;

    // ========== Setup Renderer, Scene, Camera ==========
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1014);

    const viewCam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    viewCam.position.set(5, 3, 6);

    const controls = new OrbitControls(viewCam, renderer.domElement);
    controls.target.set(0, 0.75, -2);
    controls.update();

    // ========== Parameters ==========
    const planeDist = 1.0;
    const A_x = 0.2, A_y = 0.1;
    const omega = 5.0, phi = Math.PI / 2;
    const segments = 360;

    // ========== Pyramid Camera Helper ==========
    function createPyramidCamera(color) {
        const fov = 45, aspect = 16 / 9;
        const h = 2 * planeDist * Math.tan(THREE.MathUtils.degToRad(fov) / 2);
        const w = h * aspect;
        const apex = new THREE.Vector3(0, 0, 0);
        const z = -planeDist;
        const halfW = w / 2, halfH = h / 2;

        const corners = [
            new THREE.Vector3(-halfW, halfH, z),
            new THREE.Vector3(halfW, halfH, z),
            new THREE.Vector3(halfW, -halfH, z),
            new THREE.Vector3(-halfW, -halfH, z)
        ];

        // Plane
        const planeMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
        );
        planeMesh.position.set(0, 0, z);
        planeMesh.lookAt(apex.clone().add(new THREE.Vector3(0, 0, 1)));

        // Outline
        const lines = [];
        lines.push(corners[0], corners[1], corners[1], corners[2], corners[2], corners[3], corners[3], corners[0]);
        corners.forEach(c => lines.push(apex, c));
        const pyramidLines = new THREE.LineSegments(
            new THREE.BufferGeometry().setFromPoints(lines),
            new THREE.LineBasicMaterial({ color: 0xffffff })
        );

        // Apex marker
        const apexMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.04, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffcc00 })
        );

        const group = new THREE.Group();
        group.add(planeMesh, pyramidLines, apexMesh);
        return group;
    }

    // ========== Projected Point System ==========
    function createAnimatedProjection(zPos, color) {
        const pointPos = new THREE.Vector3(0,0,zPos);

        // Point
        const pointMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.04,16,16),
            new THREE.MeshBasicMaterial({ color })
        );
        pointMesh.position.copy(pointPos);
        scene.add(pointMesh);

        // Ray (dynamic growth)
        const rayGeo = new THREE.BufferGeometry().setFromPoints([pointPos, pointPos.clone()]);
        const rayLine = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color }));
        scene.add(rayLine);

        // Marker at plane intersection
        const marker = new THREE.Mesh(
            new THREE.SphereGeometry(0.02,16,16),
            new THREE.MeshBasicMaterial({ color })
        );
        marker.visible = false;
        scene.add(marker);

        // Circle trace
        const circlePoints = [];
        const x = (-zPos - planeDist) * A_x / zPos;
        const y = (-zPos - planeDist) * A_y / zPos;
        for (let i=0;i<=segments;i++) {
            const theta = (i/segments)*Math.PI*2;
            circlePoints.push(new THREE.Vector3(
                x*Math.sin(theta),
                y*Math.sin(theta+phi),
                -planeDist
            ));
        }
        const circleGeo = new THREE.BufferGeometry().setFromPoints(circlePoints);
        circleGeo.setDrawRange(0,0);
        const circle = new THREE.Line(circleGeo, new THREE.LineDashedMaterial({ color, dashSize:0.05, gapSize:0.05 }));
        circle.computeLineDistances();
        scene.add(circle);

        return { pointPos, rayGeo, rayLine, marker, circle, circleGeo, progress:0 };
    }


    // ========== Create Cameras ==========
    const movingCam = createPyramidCamera(0x3894ff);
    scene.add(movingCam);

    const centerCam = createPyramidCamera(0xff5555);
    scene.add(centerCam);

    const staticCamApex = new THREE.Vector3(0, 0, 0);

    // ========== Points ==========
    const projA = createAnimatedProjection(-7, 0x00ff88);
    const projB = createAnimatedProjection(-2, 0xffaa00);

    // ========== Animation ==========
    const clock = new THREE.Clock();

    // ========== Projected Point System ==========


    // ========== Animation ==========
    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Move blue camera
        movingCam.position.set(
            A_x * Math.sin(omega * t),
            A_y * Math.sin(omega * t + phi),
            0.01
        );

        [projA, projB].forEach(p => {
            // Target is the moving camera apex
            const target = movingCam.position.clone();

            // Intersection point with plane z = -planeDist
            const dir = new THREE.Vector3().subVectors(target, p.pointPos).normalize();
            const tPlane = (-planeDist - p.pointPos.z) / dir.z;
            const hitPoint = p.pointPos.clone().addScaledVector(dir, tPlane);

            // Animate progress
            p.progress = Math.min(p.progress + 0.01, 2.0);

            if (p.progress < 1.0) {
                // Grow ray toward camera
                const interp = p.pointPos.clone().lerp(target, p.progress);
                p.rayGeo.setFromPoints([p.pointPos, interp]);
            } else {
                // Full ray to camera
                p.rayGeo.setFromPoints([p.pointPos, target]);

                // Show marker on plane
                p.marker.position.copy(hitPoint);
                p.marker.visible = true;

                // Reveal circle
                const circleFrac = Math.min((p.progress-1.0)*segments, segments);
                p.circleGeo.setDrawRange(0, circleFrac);
            }
        });

        if (camProgress < 1.0) {
            camProgress += 0.002;

            let newPos;
            if (camProgress < 0.5) {
                const t1 = camProgress / 0.5;
                newPos = camStart.clone().lerp(camMid, t1);
            } else {
                const t2 = (camProgress - 0.5) / 0.5;
                newPos = camMid.clone().lerp(camEnd, t2);
            }

            viewCam.position.copy(newPos);
            viewCam.lookAt(lookTarget); // always look at line between far point & camera center
        }
        renderer.render(scene, viewCam);
    }

    animate();
</script>


</body>
</html>
